id: pure-layer-no-engine-calls
valid:
  - 'class Logic { float Tick(float dt) => dt; }'
  - 'class Logic { int Roll(System.Random random) => random.Next(); }'
  - 'class Logic { DateTime Stamp(DateTime supplied) => supplied; }'
  - 'class Logic { string Text = "DateTime.Now Random.value Stopwatch FindObjectOfType"; }'
invalid:
  - 'class Logic { void Run() { Physics.Raycast(ray); } }'
  - 'class Logic { void Run() { Physics2D.Raycast(ray); } }'
  - 'class Logic { float Run() => Time.deltaTime; }'
  - 'class Logic { float Run() => Random.Range(0f, 1f); }'
  - 'class Logic { float Run() => Random.value; }'
  - 'class Logic { float Run() => UnityEngine.Random.value; }'
  - 'class Logic { float Run() => UnityEngine.Random.Range(0f, 1f); }'
  - 'class Logic { void Run() { FindObjectOfType<Player>(); } }'
  - 'class Logic { void Run() { FindObjectsOfType<Player>(); } }'
  - 'class Logic { void Run() { FindFirstObjectByType<Player>(); } }'
  - 'class Logic { void Run() { FindAnyObjectByType<Player>(); } }'
  - 'class Logic { void Run() { FindObjectsByType<Player>(mode); } }'
  - 'class Logic { void Run() { Object.FindFirstObjectByType<Player>(); } }'
  - 'class Logic { void Run() { UnityEngine.Object.FindAnyObjectByType<Player>(); } }'
  - 'class Logic { void Run() { GameObject.Find("x"); } }'
  - 'class Logic { void Run() { GameObject.FindWithTag("x"); } }'
  - 'class Logic { void Run() { UnityEngine.GameObject.FindGameObjectsWithTag("x"); } }'
  - 'class Logic { DateTime Run() => DateTime.Now; }'
  - 'class Logic { DateTime Run() => DateTime.UtcNow; }'
  - 'class Logic { DateTime Run() => System.DateTime.Now; }'
  - 'class Logic { DateTime Run() => System.DateTime.UtcNow; }'
  - 'class Logic { void Run() { var watch = new Stopwatch(); } }'
  - 'class Logic { void Run() { var watch = System.Diagnostics.Stopwatch.StartNew(); } }'
  - 'class Logic { void Run() { SceneManager.LoadScene("x"); } }'
  - 'class Logic { void Run() { Resources.Load("x"); } }'
  - 'class Logic { void Run() { Instantiate(prefab); Destroy(obj); } }'
  - 'class Logic { void Run() { GetComponent<Player>(); } }'
  - 'class Logic { void Run() { GetComponentInParent<Player>(); } }'
  - 'class Logic { void Run() { GetComponentInChildren<Player>(); } }'
  - 'class Logic { object Run() => Camera.main; }'
