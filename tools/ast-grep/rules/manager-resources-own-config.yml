id: manager-resources-own-config
language: csharp
severity: error
message: "Managers load only their own Config/Profile; foreign assets belong to their owner (§1, §4, §10; A2)."
files:
  - "Assets/Scripts/**/Manager/*.cs"
ignores:
  - "Assets/Scripts/Session/Expedition/Manager/ExpeditionSessionManager.cs" # debt: SPEC-001 Appendix A
# Fail-closed ownership allowlist, derived from Config declarations (not call sites).
# New systems/types must extend the matching namespace/type pair with a test.
rule:
  kind: invocation_expression
  regex: '^(?:UnityEngine\s*\.\s*)?Resources\s*\.\s*Load\b'
  not:
    any:
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Session\.Settings\.)?SettingsConfig\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Session\.Settings\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Session\.Progression\.(?:Shop\.)?)?(ProgressionConfig|ProgressionEntryConfig|EffectCatalogueConfig|ShrineProgressionConfig|ShopConfig)\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Session\.Progression\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Session\.HorrorEffects\.)?HorrorEffectsConfig\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Session\.HorrorEffects\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Session\.Expedition\.)?ExpeditionSpawnDriverConfig\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Session\.Expedition\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Presentation\.Audio\.)?(AudioDriverConfig|AudioSoundscapeDriverConfig)\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Presentation\.Audio\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Presentation\.Camera\.)?CameraDriverConfig\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Presentation\.Camera\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Presentation\.DebugOverlay\.)?DebugOverlayDriverConfig\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Presentation\.DebugOverlay\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Presentation\.Environment\.)?EnvironmentDriverConfig\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Presentation\.Environment\b', stopBy: end}
      - all:
          - regex: '^(?:UnityEngine\.)?Resources\s*\.\s*Load\s*<\s*(?:Worsen\.Presentation\.Fog\.)?(FogDriverConfig|FogSpikeProfile)\s*>\s*\('
          - inside: {kind: namespace_declaration, regex: '^namespace Worsen\.Presentation\.Fog\b', stopBy: end}
      - all:
