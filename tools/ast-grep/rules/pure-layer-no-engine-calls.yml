id: pure-layer-no-engine-calls
language: csharp
severity: error
message: "Engine calls belong in a Driver; inject time and randomness as data (§2, §7)."
files:
  - "Assets/Scripts/**/Controller/**/*.cs"
  - "Assets/Scripts/**/State/**/*.cs"
  - "Assets/Scripts/**/Driver/*Presenter.cs"
  - "Assets/Scripts/**/Driver/*DriverState.cs"
  - "Assets/Scripts/**/Config/*SO.cs"
  - "Assets/Scripts/Core/**/*.cs"
rule:
  any:
    - pattern: Physics.$M($$$A)
    - pattern: Physics2D.$M($$$A)
    - pattern: Time.$P
    - pattern: UnityEngine.Random.$M($$$A)
    - pattern: SceneManager.$M($$$A)
    - pattern: Resources.$M($$$A)
    - pattern: Instantiate($$$A)
    - pattern: Destroy($$$A)
    - pattern: GetComponent<$T>($$$A)
    - pattern: GetComponentInParent<$T>($$$A)
    - pattern: GetComponentInChildren<$T>($$$A)
    - pattern: Camera.main
    - pattern: Random.$M($$$A)
    - pattern: Random.$P
    - pattern: UnityEngine.Random.$P
    - kind: invocation_expression
      regex: '^(?:(?:UnityEngine\.)?Object\.)?Find(ObjectOfType|ObjectsOfType|FirstObjectByType|AnyObjectByType|ObjectsByType)\b'
    - kind: invocation_expression
      regex: '^(?:UnityEngine\.)?GameObject\.Find\w*\b'
    - kind: member_access_expression
      regex: '^(?:System\.)?DateTime\.(Now|UtcNow)$'
    - kind: identifier
      regex: '^Stopwatch$'
